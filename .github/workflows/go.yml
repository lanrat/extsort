name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: go mod download

    - name: golangci-lint
      if: runner.os == 'Linux'
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12

    - name: Test
      if: runner.os != 'Windows'
      run: make test

    # make is not reliably available on Windows runners
    - name: Test (Windows)
      if: runner.os == 'Windows'
      run: go test -timeout=5m ./...

    - name: Test with race detector
      if: runner.os == 'Linux'
      run: make test-race

    - name: Run examples
      if: runner.os == 'Linux'
      run: make examples
